<!doctype html><meta charset="utf-8" /><title>PixelKingdom face spacing correction</title>
<style>
  body {
    background: #182226;
    color: #ede6d7;
    font: 14px system-ui;
    margin: 18px;
  }
  h1 {
    font: 26px Georgia;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 12px;
  }
  article {
    background: #2a342f;
    padding: 10px;
    border: 1px solid #716446;
  }
  h2 {
    font: 18px Georgia;
    margin: 0 0 10px;
  }
  .pair {
    display: flex;
    gap: 6px;
  }
  .pair div {
    width: 50%;
    text-align: center;
  }
  svg {
    display: block;
    width: 100%;
    height: 260px;
  }
  p {
    color: #c5c5bc;
    margin: 8px 0;
  }
</style>
<h1>Facial placement · Before / after</h1>
<p>
  Same component IDs in each pair. Top: bald and beardless to expose facial spacing. Bottom: hair
  and beard fit.
</p>
<div id="grid"></div>
<script type="module">
  import { composePortrait, portraitReady } from '../../src/portrait-render.js';
  import {
    composePortrait as before,
    portraitReady as beforeReady,
  } from './portrait-wardrobe-before.js';
  const names = ['Angular', 'Broad', 'Oval', 'Round'];
  function show() {
    if (!portraitReady() || !beforeReady()) return;
    document.querySelector('#grid').innerHTML = [0, 1]
      .flatMap((row) =>
        names.map((name, head) => {
          const appearance = {
            version: 2,
            head,
            body: head,
            eyes: 0,
            nose: head,
            mouth: head,
            hair: row ? (head < 2 ? 4 : 3) : 0,
            beard: row && head < 2 ? 4 : 0,
            outfit: head % 2 ? 0 : 2,
            skin: head % 2 ? 3 : 0,
          };
          const p = { appearance };
          return `<article><h2>${name}</h2><div class="pair">${[
            [before(p), 'Before'],
            [composePortrait(p), 'After'],
          ]
            .map(
              ([url, label]) =>
                `<div><svg viewBox="120 45 272 350" role="img" aria-label="${name} ${label}"><image href="${url}" width="512" height="640"/></svg><p>${label}</p></div>`,
            )
            .join('')}</div></article>`;
        }),
      )
      .join('');
  }
  window.addEventListener('portraits-ready', show);
  show();
</script>
